server.port=${PORT:8080}

# Banco Embutido H2 em modo de compatibilidade PostgreSQL (Zero configuração externa para MVP)
spring.datasource.url=jdbc:h2:file:./data/caresys_mvp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza automaticamente todas as tabelas a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# JWT Configuration
caresys.jwt.secret=${CARESYS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
caresys.jwt.expiration-ms=${CARESYS_JWT_EXPIRATION_MS:3600000}
caresys.jwt.refresh-expiration-ms=${CARESYS_JWT_REFRESH_EXPIRATION_MS:604800000}

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Sao_Paulo
