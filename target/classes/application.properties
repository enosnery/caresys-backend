server.port=${PORT:8080}

# Database connection - PostgreSQL (Local default ou variáveis de ambiente no Koyeb)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/caresys_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hy581321}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP otimizado para Koyeb / Neon Free Tier (permite scale-to-zero do banco quando ocioso para economizar as 50h/mês)
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:0}
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:5}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000

# JPA & Hibernate (update garante criação/atualização automática das tabelas ao subir no Koyeb)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# JWT Configuration (1 hora = 3600000 ms; Refresh Token = 7 dias = 604800000 ms)
caresys.jwt.secret=${CARESYS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
caresys.jwt.expiration-ms=${CARESYS_JWT_EXPIRATION_MS:3600000}
caresys.jwt.refresh-expiration-ms=${CARESYS_JWT_REFRESH_EXPIRATION_MS:604800000}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=America/Sao_Paulo
